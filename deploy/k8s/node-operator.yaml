apiVersion: v1
kind: ConfigMap
metadata:
  name: node-operator-config
  namespace: marathon
data:
  MARATHON_ORCHESTRATOR_ADDRESS: "orchestrator"
  MARATHON_ORCHESTRATOR_PORT: "8080"
  MARATHON_TOTAL_VM_SLOTS: "10"
  MARATHON_WARM_POOL_TARGET: "5"
  MARATHON_SNAPSHOT_PATH: "/var/lib/marathon/snapshots"
  MARATHON_FIRECRACKER_BIN: "/usr/bin/firecracker"
  MARATHON_KERNEL_PATH: "/var/lib/marathon/kernel/vmlinux"
  MARATHON_ROOTFS_PATH: "/var/lib/marathon/rootfs/rootfs.ext4"
---
apiVersion: v1
kind: Secret
metadata:
  name: node-operator-secrets
  namespace: marathon
type: Opaque
stringData:
  MARATHON_NODE_AUTH_KEY: "replace-with-shared-node-key"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-operator
  namespace: marathon
  labels:
    app: node-operator
spec:
  selector:
    matchLabels:
      app: node-operator
  template:
    metadata:
      labels:
        app: node-operator
    spec:
      hostPID: true
      hostNetwork: true
      nodeSelector:
        marathon.io/compute-node: "true"
        kubernetes.io/arch: amd64
      tolerations:
      - key: "marathon.io/compute-node"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: node-operator
        image: marathon/node-operator:latest
        securityContext:
          privileged: true
        envFrom:
        - configMapRef:
            name: node-operator-config
        - secretRef:
            name: node-operator-secrets
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: "1000m"
            memory: "1Gi"
          limits:
            cpu: "4000m"
            memory: "4Gi"
        volumeMounts:
        - name: dev-kvm
          mountPath: /dev/kvm
        - name: snapshots
          mountPath: /var/lib/marathon/snapshots
        - name: rootfs
          mountPath: /var/lib/marathon/rootfs
        - name: kernel
          mountPath: /var/lib/marathon/kernel
        - name: run
          mountPath: /run/firecracker
      volumes:
      - name: dev-kvm
        hostPath:
          path: /dev/kvm
          type: CharDevice
      - name: snapshots
        hostPath:
          path: /var/lib/marathon/snapshots
          type: DirectoryOrCreate
      - name: rootfs
        hostPath:
          path: /var/lib/marathon/rootfs
          type: DirectoryOrCreate
      - name: kernel
        hostPath:
          path: /var/lib/marathon/kernel
          type: DirectoryOrCreate
      - name: run
        hostPath:
          path: /run/firecracker
          type: DirectoryOrCreate
